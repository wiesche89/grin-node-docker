name: Build UI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      qt: ${{ steps.release.outputs.qt }}
      emscripten: ${{ steps.release.outputs.emscripten }}
      build: ${{ steps.published.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Read release config
        id: release
        run: |
          jq -e '
            [.version, .qt, .emscripten] |
            all(.[]; test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))
          ' releases.json > /dev/null
          jq -r 'to_entries[] | "\(.key)=\(.value)"' releases.json >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Check published release
        id: published
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          build=true
          if [[ "$PUBLISH" == true ]]; then
            image="wiesche89/grin-node-docker:$VERSION"
            if docker manifest inspect "$image" > /dev/null 2> registry-error.txt; then
              echo "Skipping published release $image"
              build=false
            elif ! grep -Eq 'no such manifest:|manifest unknown' registry-error.txt; then
              cat registry-error.txt >&2
              exit 1
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    if: needs.release.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ needs.release.outputs.emscripten }}

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ needs.release.outputs.qt }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ needs.release.outputs.qt }}
          host: all_os
          target: wasm
          arch: wasm_singlethread
          modules: qtcharts
          cache: true
          set-env: false

      - name: Check QML
        run: QT_QPA_PLATFORM=offscreen "$QT_ROOT_DIR/bin/qmltestrunner" -import tests/qml -input tests/qml

      - name: Build WASM
        run: |
          mkdir -p build/wasm
          cd build/wasm
          "$QT_ROOT_DIR/../wasm_singlethread/bin/qmake" ../../grin-node-docker.pro -spec wasm-emscripten CONFIG+=release
          make -j"$(nproc)"

      - name: Collect assets
        run: |
          mkdir -p build/wasm-dist
          for file in grin-node-docker.html grin-node-docker.js grin-node-docker.wasm qtloader.js; do
            test -s "build/wasm/$file"
            cp "build/wasm/$file" build/wasm-dist/
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ github.sha }}
          path: build/wasm-dist/
          if-no-files-found: error

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: grin-ui:test

      - name: Check nginx
        run: |
          docker run -d --name ui-check -e CONTROLLER_PROXY=127.0.0.1:8080 grin-ui:test
          trap 'docker rm -f ui-check' EXIT
          for attempt in $(seq 1 15); do
            if docker exec ui-check wget -q -O /dev/null http://127.0.0.1/grin-node-docker.html; then
              docker exec ui-check nginx -t
              exit 0
            fi
            sleep 2
          done
          docker logs ui-check
          exit 1

      - uses: docker/metadata-action@v5
        id: tags
        with:
          images: wiesche89/grin-node-docker
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
